<!DOCTYPE html>
<html lang="en">

<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CA Inter Study Partner · Jan 2027 Pro Test & Question Engine</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap');

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>

<body class="bg-slate-50 min-h-screen">
  <div id="root"></div>

  <!-- Data Script -->
  <script src="./data/embedded_data.js?v=20261123_clean"></script>

  <!-- React Application Logic -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Use embedded CA Inter database
    const DB = window.CA_INTER_DB || {};

        // Robust ErrorBoundary Component
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("ErrorBoundary caught:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="max-w-3xl mx-auto my-12 p-6 bg-red-50 border-2 border-red-500 rounded-2xl text-red-900 shadow-2xl">
              <div className="flex items-center gap-3 mb-3">
                <span className="text-3xl">⚠️</span>
                <div>
                  <h3 className="text-lg font-black text-red-800">Application Error Encountered</h3>
                  <p className="text-xs text-red-600">Cached browser data caused a temporary rendering conflict.</p>
                </div>
              </div>
              <pre className="p-3 bg-white rounded-xl border border-red-200 text-xs text-red-700 overflow-auto max-h-48 mb-4 font-mono">
                {String(this.state.error?.stack || this.state.error?.message || this.state.error)}
              </pre>
              <div className="flex gap-3">
                <button
                  onClick={() => { localStorage.clear(); window.location.reload(); }}
                  className="px-4 py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl text-xs transition cursor-pointer"
                >
                  🧹 Clear Storage & Reload Clean
                </button>
                <button
                  onClick={() => window.location.reload()}
                  className="px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl text-xs transition cursor-pointer"
                >
                  🔄 Simple Reload
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function App() {
      // Navigation states: 'subjects' | 'questions' | 'testSeries' | 'trendAnalysis' | 'notes'
      const [currentView, setCurrentView] = useState('questions');
      const [selectedSubjectId, setSelectedSubjectId] = useState('paper-5');
      const [activeTab, setActiveTab] = useState('Subjective'); // 'Subjective' | 'MCQs' | 'Important' | 'Quick Concepts'
      const [navSection, setNavSection] = useState('Past Papers'); // 'Past Papers' | 'Test Series' | 'Articles'

      // Filters
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedSource, setSelectedSource] = useState('all');
      const [selectedYear, setSelectedYear] = useState('all');
      const [selectedTopic, setSelectedTopic] = useState('all');
      const [filterRead, setFilterRead] = useState(false);
      const [filterNotes, setFilterNotes] = useState(false);
      const [filterImportant, setFilterImportant] = useState(false);

      // User state persisted in localStorage
            // User state persisted in localStorage with strict Array guards
      const [readIds, setReadIds] = useState(() => {
        try {
          const parsed = JSON.parse(localStorage.getItem('ca_read_ids'));
          return Array.isArray(parsed) ? parsed : [];
        } catch { return []; }
      });
      const [importantIds, setImportantIds] = useState(() => {
        try {
          const parsed = JSON.parse(localStorage.getItem('ca_important_ids'));
          return Array.isArray(parsed) ? parsed : [];
        } catch { return []; }
      });
      const [userNotes, setUserNotes] = useState(() => {
        try {
          const parsed = JSON.parse(localStorage.getItem('ca_user_notes'));
          return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : {};
        } catch { return {}; }
      });

      // Modal state for viewing a question
      const [activeQuestion, setActiveQuestion] = useState(null);
      const [lockedPopupMessage, setLockedPopupMessage] = useState(null);

      // ── SCRAPED FM/SM OFFICIAL ICAI SUGGESTED ANSWERS STATES ──
      const scrapedData = useMemo(() => DB.scrapedFmSm || { questions: [], fmChapters: [], smChapters: [] }, []);
      const scrapedQuestions = useMemo(() => scrapedData.questions || [], [scrapedData]);
      const [scrapedSubjFilter, setScrapedSubjFilter] = useState('all'); // 'all' | 'Financial Management' | 'Strategic Management'
      const [scrapedCategoryFilter, setScrapedCategoryFilter] = useState('all'); // 'all' | 'Subjective' | 'MCQs'
      const [scrapedChapterFilter, setScrapedChapterFilter] = useState('all');
      const [scrapedAttemptFilter, setScrapedAttemptFilter] = useState('all');
      const [scrapedSearchQuery, setScrapedSearchQuery] = useState('');

      // Dynamically filtered questions
      const filteredScrapedQuestions = useMemo(() => {
        return scrapedQuestions.filter(q => {
          if (scrapedSubjFilter !== 'all' && q.subject !== scrapedSubjFilter) return false;
          if (scrapedCategoryFilter !== 'all' && q.category !== scrapedCategoryFilter) return false;
          if (scrapedChapterFilter !== 'all' && q.chapter !== scrapedChapterFilter) return false;
          if (scrapedAttemptFilter !== 'all' && q.attempt !== scrapedAttemptFilter) return false;
          if (scrapedSearchQuery.trim()) {
            const query = scrapedSearchQuery.toLowerCase();
            const textMatch = (q.question || '').toLowerCase().includes(query) ||
                              (q.chapter || '').toLowerCase().includes(query) ||
                              (q.qNo || '').toLowerCase().includes(query) ||
                              (q.attempt || '').toLowerCase().includes(query) ||
                              (q.subject || '').toLowerCase().includes(query);
            if (!textMatch) return false;
          }
          return true;
        });
      }, [scrapedQuestions, scrapedSubjFilter, scrapedCategoryFilter, scrapedChapterFilter, scrapedAttemptFilter, scrapedSearchQuery]);

      // Counts for pills
      const countFM = useMemo(() => scrapedQuestions.filter(q => q.subject === 'Financial Management').length, [scrapedQuestions]);
      const countSM = useMemo(() => scrapedQuestions.filter(q => q.subject === 'Strategic Management').length, [scrapedQuestions]);
      const currentSubjectQuestions = useMemo(() => {
        return scrapedQuestions.filter(q => {
          if (scrapedSubjFilter === 'all') return true;
          return q.subject === scrapedSubjFilter;
        });
      }, [scrapedQuestions, scrapedSubjFilter]);
      const countSubjective = useMemo(() => currentSubjectQuestions.filter(q => q.category === 'Subjective').length, [currentSubjectQuestions]);
      const countMCQ = useMemo(() => currentSubjectQuestions.filter(q => q.category === 'MCQs').length, [currentSubjectQuestions]);
      const [modalMode, setModalMode] = useState('Both'); // 'Both' | 'Question' | 'Answer'
      const [showAnswer, setShowAnswer] = useState(false);
      const [showNotesDrawer, setShowNotesDrawer] = useState(false);
      const [currentNoteText, setCurrentNoteText] = useState('');
      const [selectedMcqOption, setSelectedMcqOption] = useState(null);
      const [caseStudyAnswers, setCaseStudyAnswers] = useState({});
      const [isFullScreen, setIsFullScreen] = useState(false);

      // Keyboard shortcut listener for Esc key (exit fullscreen or close modal)
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') {
            if (isFullScreen) {
              setIsFullScreen(false);
            } else if (activeQuestion) {
              setActiveQuestion(null);
            }
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isFullScreen, activeQuestion]);

      // Test Series State
      const [testActive, setTestActive] = useState(false);
      const [testSubject, setTestSubject] = useState('paper-1');
      const [testTimeLeft, setTestTimeLeft] = useState(1800); // 30 mins
      const [testQuestions, setTestQuestions] = useState([]);
      const [currentTestQIdx, setCurrentTestQIdx] = useState(0);
      const [testAnswers, setTestAnswers] = useState({});
      const [testReviewStatus, setTestReviewStatus] = useState({});
      const [testResult, setTestResult] = useState(null);

      // Save user marks to localStorage
      useEffect(() => {
        try { localStorage.setItem('ca_read_ids', JSON.stringify(readIds)); } catch { }
      }, [readIds]);

      useEffect(() => {
        try { localStorage.setItem('ca_important_ids', JSON.stringify(importantIds)); } catch { }
      }, [importantIds]);

      useEffect(() => {
        try { localStorage.setItem('ca_user_notes', JSON.stringify(userNotes)); } catch { }
      }, [userNotes]);

      // Re-trigger Lucide icons on view change
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Subject Data lookup
      const currentSubjectMeta = useMemo(() => {
        const allSubs = [...(DB.subjects?.group1 || []), ...(DB.subjects?.group2 || [])];
        return allSubs.find(s => s.id === selectedSubjectId) || allSubs[0];
      }, [selectedSubjectId]);

      const currentQuestionsList = useMemo(() => {
        return DB.questionsBySubject?.[selectedSubjectId]?.questions || [];
      }, [selectedSubjectId]);

      // Unique Topics & Sources & Years for filters
      const filterOptions = useMemo(() => {
        const topics = new Set();
        const sources = new Set();
        const years = new Set();

        currentQuestionsList.forEach(q => {
          if (q.topic) topics.add(q.topic);
          if (q.source) sources.add(q.source);
          if (q.year) years.add(q.year);
        });

        return {
          topics: Array.from(topics),
          sources: Array.from(sources),
          years: Array.from(years)
        };
      }, [currentQuestionsList]);

      // Filtered questions
      const filteredQuestions = useMemo(() => {
        return currentQuestionsList.filter(q => {
          // Tab filter
          if (activeTab === 'Subjective' && q.category !== 'Subjective') return false;
          if (activeTab === 'MCQs' && q.category !== 'MCQs') return false;
          if (activeTab === 'Important' && !importantIds.includes(q.id)) return false;

          // Dropdown filters
          if (selectedSource !== 'all' && q.source !== selectedSource) return false;
          if (selectedYear !== 'all' && q.year !== selectedYear) return false;
          if (selectedTopic !== 'all' && q.topic !== selectedTopic) return false;

          // Pill filters
          if (filterRead && !readIds.includes(q.id)) return false;
          if (filterImportant && !importantIds.includes(q.id)) return false;
          if (filterNotes && !userNotes[q.id]) return false;

          // Search query
          if (searchQuery.trim()) {
            const query = searchQuery.toLowerCase();
            const textMatch = (q.question || '').toLowerCase().includes(query) ||
              (q.topic || '').toLowerCase().includes(query) ||
              (q.subTopic || '').toLowerCase().includes(query) ||
              (q.source || '').toLowerCase().includes(query) ||
              (q.year || '').toLowerCase().includes(query);
            if (!textMatch) return false;
          }

          return true;
        });
      }, [currentQuestionsList, activeTab, selectedSource, selectedYear, selectedTopic, filterRead, filterImportant, filterNotes, searchQuery, readIds, importantIds, userNotes]);

      // Handle Subject Card Click
      const handleOpenSubject = (subId) => {
        if (subId === 'paper-6') {
          setCurrentView('scrapedFmSm');
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }
        if (subId !== 'paper-5') {
          setLockedPopupMessage({
            title: 'Subject Locked 🔒',
            body: 'Currently, only Paper-5 (Auditing & Ethics - 580 Qs) and Paper-6 (FM & SM - 268 Qs) are unlocked. Remaining subjects will be unlocked in upcoming updates!'
          });
          return;
        }
        setSelectedSubjectId('paper-5');
        setCurrentView('questions');
        setActiveTab('Subjective');
        setSelectedTopic('all');
        setSelectedSource('all');
        setSelectedYear('all');
        setSearchQuery('');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      // Handle Question Click to open modal
      const handleOpenQuestionModal = (q) => {
        setActiveQuestion(q);
        setShowAnswer(false);
        setModalMode('Both');
        setShowNotesDrawer(false);
        setCurrentNoteText(userNotes[q.id] || '');
        setSelectedMcqOption(null);
        setCaseStudyAnswers({});
      };

      // Toggle Read Status
            // Toggle Read Status
      const toggleRead = (qId, e) => {
        if (e) e.stopPropagation();
        setReadIds(prev => {
          const arr = Array.isArray(prev) ? prev : [];
          return arr.includes(qId) ? arr.filter(id => id !== qId) : [...arr, qId];
        });
      };

      // Toggle Important Status
      const toggleImportant = (qId, e) => {
        if (e) e.stopPropagation();
        setImportantIds(prev => {
          const arr = Array.isArray(prev) ? prev : [];
          const next = arr.includes(qId) ? arr.filter(id => id !== qId) : [...arr, qId];
          if (!arr.includes(qId) && typeof window.confetti === 'function') {
            window.confetti({ particleCount: 30, spread: 50, origin: { y: 0.8 } });
          }
          return next;
        });
      };

      // Save Note
      const handleSaveNote = () => {
        if (!activeQuestion) return;
        setUserNotes(prev => ({
          ...prev,
          [activeQuestion.id]: currentNoteText
        }));
        setShowNotesDrawer(false);
      };

      // Question Modal Navigation (Previous / Next)
      const handleNavigateQuestion = (direction) => {
        if (!activeQuestion) return;
        const qList = currentView === 'scrapedFmSm' ? filteredScrapedQuestions : filteredQuestions;
        const currentIdx = qList.findIndex(q => q.id === activeQuestion.id);
        if (currentIdx === -1) return;

        const nextIdx = direction === 'next'
          ? (currentIdx + 1) % qList.length
          : (currentIdx - 1 + qList.length) % qList.length;

        handleOpenQuestionModal(qList[nextIdx]);
      };

      // Close modal on Escape key
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') {
            if (activeQuestion) {
              if (isFullScreen) {
                setIsFullScreen(false);
              } else {
                setActiveQuestion(null);
              }
            } else if (lockedPopupMessage) {
              setLockedPopupMessage(null);
            }
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [activeQuestion, isFullScreen, lockedPopupMessage]);

      // ── TEST SERIES TIMER & ENGINE ──
      useEffect(() => {
        if (!testActive) return;
        const timer = setInterval(() => {
          setTestTimeLeft(prev => {
            if (prev <= 1) {
              clearInterval(timer);
              handleSubmitTest();
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [testActive]);

      const handleStartTest = (subId, minutes = 20) => {
        const pool = DB.questionsBySubject?.[subId]?.questions || [];
        const mcqs = pool.filter(q => q.category === 'MCQs');
        const questionsForTest = mcqs.length >= 5 ? mcqs.slice(0, 10) : pool.slice(0, 10);

        setTestSubject(subId);
        setTestQuestions(questionsForTest);
        setTestAnswers({});
        setTestReviewStatus({});
        setTestTimeLeft(minutes * 60);
        setCurrentTestQIdx(0);
        setTestResult(null);
        setTestActive(true);
        setCurrentView('testSeries');
      };

      const handleSubmitTest = () => {
        setTestActive(false);
        let score = 0;
        let totalMarks = 0;
        let attempted = 0;

        testQuestions.forEach(q => {
          if (q.type === 'Single MCQ') {
            totalMarks += q.marks || 1;
            const userAns = testAnswers[q.id];
            if (userAns) {
              attempted++;
              if (userAns === q.correctOption) {
                score += q.marks || 1;
              }
            }
          } else if (q.type === 'Case Study' && q.subQuestions) {
            q.subQuestions.forEach(sub => {
              totalMarks += 2;
              const subAns = testAnswers[`${q.id}_${sub.qNo}`];
              if (subAns) {
                attempted++;
                if (subAns === sub.correctOption) {
                  score += 2;
                }
              }
            });
          } else {
            totalMarks += q.marks || 5;
            if (testAnswers[q.id]) attempted++;
          }
        });

        setTestResult({
          score,
          totalMarks,
          attempted,
          totalQuestions: testQuestions.length,
          percentage: totalMarks > 0 ? ((score / totalMarks) * 100).toFixed(1) : 0
        });

        if (typeof window.confetti === 'function') window.confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
      };

      // Format seconds to MM:SS
      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-900">

          {/* ── TOP HEADER / NAVBAR (Exact Match to castudypartner.com) ── */}
          <header className="bg-gradient-to-r from-[#2c2779] via-[#352f94] to-[#1f1a5f] text-white sticky top-0 z-30 shadow-md">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-14 sm:h-16">

                {/* Left Brand & Badge */}
                <div className="flex items-center gap-3">
                  <div
                    onClick={() => { setCurrentView('subjects'); setNavSection('Past Papers'); }}
                    className="flex items-center gap-2 cursor-pointer group"
                  >
                    <div className="size-8 rounded-lg bg-white/10 flex items-center justify-center font-black text-amber-300 text-sm border border-white/20">
                      CA
                    </div>
                    <span className="font-extrabold text-base sm:text-lg tracking-tight group-hover:text-amber-200 transition">
                      castudypartner<span className="text-amber-400">.com</span>
                    </span>
                  </div>

                  <span className="hidden md:inline-flex items-center text-[10px] font-mono font-bold bg-white/10 text-pink-200 px-2.5 py-1 rounded-full border border-white/15">
                    Free Login: Unlimited (Jan 2027 Pro)
                  </span>
                </div>

                {/* Center Navigation Pills (Desktop - Clean & Separated) */}
                <div className="hidden md:flex items-center bg-black/25 p-1 rounded-full border border-white/15 text-xs font-bold gap-1">
                  <button
                    onClick={() => { setNavSection('Past Papers'); setCurrentView('subjects'); }}
                    className={`px-3.5 py-1.5 rounded-full transition cursor-pointer ${currentView === 'subjects'
                      ? 'bg-white text-indigo-950 shadow-xs font-extrabold'
                      : 'text-white/80 hover:text-white'
                      }`}
                  >
                    🏠 All Papers
                  </button>
                  
                  {/* Dedicated Button for Paper-5: Auditing (580 Subjective Qs) */}
                  <button
                    onClick={() => {
                      setSelectedSubjectId('paper-5');
                      setCurrentView('questions');
                      setActiveTab('Subjective');
                      setNavSection('Past Papers');
                    }}
                    className={`px-3.5 py-1.5 rounded-full transition cursor-pointer flex items-center gap-1.5 font-bold ${
                      currentView === 'questions' && selectedSubjectId === 'paper-5'
                        ? 'bg-emerald-400 text-slate-950 font-extrabold shadow-sm'
                        : 'bg-emerald-400/20 text-emerald-300 hover:bg-emerald-400/30 border border-emerald-400/30'
                    }`}
                    title="Open Paper-5 Auditing & Ethics Subjective Database (580 Qs)"
                  >
                    <span>📜</span>
                    <span>Paper-5: Audit (580 Subjective)</span>
                  </button>

                  {/* Dedicated Button for Paper-6: FM/SM Scraped (268 Qs) */}
                  <button
                    onClick={() => { setCurrentView('scrapedFmSm'); setNavSection('Past Papers'); }}
                    className={`px-3.5 py-1.5 rounded-full transition cursor-pointer flex items-center gap-1.5 font-bold ${
                      currentView === 'scrapedFmSm'
                        ? 'bg-amber-400 text-slate-950 font-extrabold shadow-sm'
                        : 'bg-amber-400/20 text-amber-300 hover:bg-amber-400/30 border border-amber-400/30'
                    }`}
                    title="Open Official ICAI PDF Scraped FM & SM (268 Qs)"
                  >
                    <span>📑</span>
                    <span>Paper-6: FM/SM ({scrapedQuestions.length || 268} Scraped)</span>
                  </button>
                </div>

                {/* Right Profile & Actions */}
                <div className="flex items-center gap-2.5 sm:gap-3 text-xs font-semibold">
                  <button
                    onClick={() => alert("CA Study Partner Helpdesk: WhatsApp +91 9530339508 or email blushwish.in@gmail.com for instant CA Inter queries.")}
                    className="hidden sm:inline-block px-3 py-1 rounded-full bg-white/10 hover:bg-white/20 transition cursor-pointer border border-white/20 text-white"
                  >
                    Help
                  </button>

                  <div className="flex items-center gap-1.5 bg-white/15 hover:bg-white/25 px-2.5 sm:px-3 py-1 rounded-full cursor-pointer transition border border-white/20">
                    <span className="size-5 rounded-full bg-amber-400 text-slate-900 flex items-center justify-center font-bold text-[10px]">
                      K
                    </span>
                    <span className="font-bold">kuku</span>
                    <span className="text-[10px] text-white/70">▾</span>
                  </div>
                </div>

              </div>
            </div>

            {/* Mobile Sub-Header Navigation */}
            <div className="md:hidden flex items-center gap-1.5 px-3 py-1.5 bg-[#252069] border-t border-white/10 overflow-x-auto text-xs font-bold text-white no-scrollbar">
              <button
                onClick={() => { setNavSection('Past Papers'); setCurrentView('subjects'); }}
                className={`px-3 py-1 rounded-full transition flex-shrink-0 cursor-pointer text-[11px] ${
                  currentView === 'subjects' ? 'bg-white text-indigo-950 shadow-xs' : 'text-white/80 hover:text-white'
                }`}
              >
                🏠 Home
              </button>
              
              <button
                onClick={() => {
                  setSelectedSubjectId('paper-5');
                  setCurrentView('questions');
                  setActiveTab('Subjective');
                }}
                className={`px-3 py-1 rounded-full transition flex-shrink-0 cursor-pointer text-[11px] font-bold flex items-center gap-1 ${
                  currentView === 'questions' && selectedSubjectId === 'paper-5'
                    ? 'bg-emerald-400 text-slate-950 shadow-xs'
                    : 'bg-emerald-400/20 text-emerald-300 hover:bg-emerald-400/30 border border-emerald-400/30'
                }`}
              >
                <span>📜</span>
                <span>Paper-5 Audit (580)</span>
              </button>

              <button
                onClick={() => { setCurrentView('scrapedFmSm'); setNavSection('Past Papers'); }}
                className={`px-3 py-1 rounded-full transition flex-shrink-0 cursor-pointer text-[11px] font-bold flex items-center gap-1 ${
                  currentView === 'scrapedFmSm'
                    ? 'bg-amber-400 text-slate-950 shadow-xs'
                    : 'bg-amber-400/20 text-amber-300 hover:bg-amber-400/30 border border-amber-400/30'
                }`}
              >

              </div>
